<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Vault mark: a vault door — a rounded frame around a combination
       dial — in the family's green gradient on the app's dark surface. The
       raster icons (scripts/generate-icons.mjs) trace this same geometry;
       keep the two in lockstep (frame half-extent 36, corner r 8, stroke
       6.4, ring r 23.5, hub r 7.5, spokes to 31.5). -->
  <defs>
    <linearGradient id="ink" x1="0" y1="15" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0b0d10"/>
  <g stroke="url(#ink)" stroke-width="6.4" fill="none">
    <rect x="14" y="14" width="72" height="72" rx="8"/>
    <circle cx="50" cy="50" r="23.5"/>
    <path d="M50 18.5v13M50 68.5v13M18.5 50h13M68.5 50h13"/>
  </g>
  <circle cx="50" cy="50" r="7.5" fill="url(#ink)"/>
</svg>
