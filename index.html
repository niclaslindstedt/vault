<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Vault — a local-first document vault</title>
    <meta
      name="description"
      content="Vault is a local-first document vault PWA. Scan receipts and important documents, organise them in categories, folders and tags, search inside them with built-in OCR, and keep them on your device — or encrypted in Dropbox."
    />
    <link rel="canonical" href="https://niclaslindstedt.github.io/vault/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vault — a local-first document vault" />
    <meta
      property="og:description"
      content="A privacy-first document vault PWA: receipt/document scanner, OCR text search, categories, folders and tags — stored on your device by default, always encrypted in the cloud."
    />
    <meta
      property="og:url"
      content="https://niclaslindstedt.github.io/vault/"
    />
    <meta
      property="og:image"
      content="https://niclaslindstedt.github.io/vault/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vault — a local-first document vault" />
    <meta
      name="twitter:description"
      content="A privacy-first document vault PWA: scan, OCR-search, and organise your important documents — on-device by default, always encrypted in the cloud."
    />
    <meta
      name="twitter:image"
      content="https://niclaslindstedt.github.io/vault/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Vault",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "description": "A local-first document vault PWA with a built-in receipt/document scanner, OCR text search, categories, folders and tags, and optional encrypted Dropbox sync.",
        "url": "https://niclaslindstedt.github.io/vault/",
        "image": "https://niclaslindstedt.github.io/vault/og.png",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
